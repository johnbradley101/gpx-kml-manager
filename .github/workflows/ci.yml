name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress; main and tags always finish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          # Free for public repositories. The Synology may be ARM, so run the tests there too.
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Everything under tests/ except the browser tests, so a new test file is never silently skipped.
      - run: python -m pytest -q tests --ignore=tests/e2e

  e2e:
    name: Browser tests (real Leaflet)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch Leaflet (same as the Docker build does)
        run: |
          cd "$RUNNER_TEMP"
          npm pack leaflet@1.9.4 --silent
          tar xzf leaflet-1.9.4.tgz
          mkdir -p "$GITHUB_WORKSPACE/app/static/vendor/leaflet"
          cp -r package/dist/leaflet.js package/dist/leaflet.css package/dist/images "$GITHUB_WORKSPACE/app/static/vendor/leaflet/"
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: python -m pytest -q tests/e2e
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots/
          if-no-files-found: ignore

  smoke:
    name: Container smoke test (${{ matrix.arch }})
    needs: [backend, e2e]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build for the machine we are on and run the real container, on both CPU types.
      - name: Build (native)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gpx-kml-manager:ci
          cache-from: type=gha
      - name: Smoke test the container
        run: |
          docker run -d --name gkm -p 8080:8080 -v "$RUNNER_TEMP/data:/data" gpx-kml-manager:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/ | grep -q "GPX &amp; KML Manager"
          curl -fsS -o /dev/null http://127.0.0.1:8080/static/vendor/leaflet/leaflet.js
          curl -fsS -F "files=@tests/fixtures/sample.gpx" http://127.0.0.1:8080/api/files | grep -q '"ok": *true'
          curl -fsS "http://127.0.0.1:8080/api/convert?to=kml" -F "file=@tests/fixtures/sample.gpx" | grep -q "<kml"
      - name: Container logs
        if: always()
        run: |
          docker logs gkm || true
          docker rm -f gkm || true

  image:
    name: Multi-arch image (amd64 + arm64)
    needs: [smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Prove the multi-platform build works on pull requests, without pushing.
      - name: Build amd64 + arm64
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Publish to GitHub Container Registry from main and version tags.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: Build and push amd64 + arm64
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
