name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_app.py

  e2e:
    name: Browser tests (real Leaflet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch Leaflet (same as the Docker build does)
        run: |
          cd "$RUNNER_TEMP"
          npm pack leaflet@1.9.4 --silent
          tar xzf leaflet-1.9.4.tgz
          mkdir -p "$GITHUB_WORKSPACE/app/static/vendor/leaflet"
          cp -r package/dist/leaflet.js package/dist/leaflet.css package/dist/images "$GITHUB_WORKSPACE/app/static/vendor/leaflet/"
      - run: pip install -r requirements.txt pytest playwright
      - run: playwright install --with-deps chromium
      - run: python -m pytest -q tests/e2e
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots/
          if-no-files-found: ignore

  docker:
    name: Docker image (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: [backend, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # 1. Build for the machine we are on and smoke-test the real container.
      - name: Build (native) for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gpx-kml-manager:ci
          cache-from: type=gha
      - name: Smoke test the container
        run: |
          docker run -d --name gkm -p 8080:8080 -v "$RUNNER_TEMP/data:/data" gpx-kml-manager:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS http://127.0.0.1:8080/ | grep -q "GPX &amp; KML Manager"
          curl -fsS -o /dev/null http://127.0.0.1:8080/static/vendor/leaflet/leaflet.js
          curl -fsS -F "files=@tests/fixtures/sample.gpx" http://127.0.0.1:8080/api/files | grep -q '"ok": *true'
          curl -fsS "http://127.0.0.1:8080/api/convert?to=kml" -F "file=@tests/fixtures/sample.gpx" | grep -q "<kml"
          docker logs gkm
          docker rm -f gkm

      # 2. Prove the image also builds for ARM (Synology J/value models) - not pushed on PRs.
      - name: Build amd64 + arm64
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Publish to GitHub Container Registry from main and version tags.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and tags
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - name: Build and push amd64 + arm64
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
